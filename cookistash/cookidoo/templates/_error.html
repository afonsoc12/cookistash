<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ code }} · Cookistash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/cookidoo/img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/cookidoo/img/favicon-16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f5f2;
            --text: #211d1a;
            --muted: #837a70;
            --border: #ece7e0;
            --primary: #e8590c;
            --primary-dark: #c94a09;
            --red: #c0392b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        .error-card {
            text-align: center;
            padding: 48px 32px;
            max-width: 420px;
        }
        .logo-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 28px;
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: grayscale(65%);
            opacity: 0.85;
        }
        .logo-cross {
            position: absolute;
            inset: 0;
        }
        .logo-cross::before,
        .logo-cross::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 132%;
            height: 6px;
            background: var(--red);
            border-radius: 3px;
            box-shadow: 0 0 0 3px var(--bg);
        }
        .logo-cross::before { transform: translate(-50%, -50%) rotate(45deg); }
        .logo-cross::after { transform: translate(-50%, -50%) rotate(-45deg); }
        .error-code {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 8px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 12px;
        }
        p {
            color: var(--muted);
            line-height: 1.5;
            margin: 0 0 28px;
        }
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.15s ease;
        }
        .home-link:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="logo-wrap">
            <img src="/static/cookidoo/img/icon.png" alt="Cookistash">
            <div class="logo-cross"></div>
        </div>
        <div class="error-code">Error {{ code }}</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="home-link" href="/">← Back to Cookistash</a>
    </div>
</body>
</html>
