name: Dev Release

# Continuous build on every push to main - real releases are handled entirely
# by release.yml instead (see CLAUDE.md). No GitHub release is
# created here; the wheel/sdist is just uploaded as a workflow artifact and
# the Docker image gets a rolling :dev tag.

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write

  meta:
    name: Determine dev build metadata
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      docker_tags: ${{ steps.meta.outputs.docker_tags }}
      version_suffix: ${{ steps.meta.outputs.version_suffix }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: 🏷️ Determine metadata
        id: meta
        run: |
          set -euo pipefail

          VERSION=$(uv version --short)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION"
          echo "SHORT_SHA=$SHORT_SHA"

          # Docker tags can't contain "+", so use "-" there instead of the SemVer build-metadata separator.
          echo "docker_tags=ghcr.io/afonsoc12/cookistash:dev,ghcr.io/afonsoc12/cookistash:${VERSION}-dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          # Gives each dev wheel a unique filename without touching the committed version.
          echo "version_suffix=+dev.${SHORT_SHA}" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: meta
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.sha }}
      docker_tags: ${{ needs.meta.outputs.docker_tags }}
      version_suffix: ${{ needs.meta.outputs.version_suffix }}
