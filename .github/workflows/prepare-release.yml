name: Prepare Release

concurrency:
  group: prepare-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      release_notes: ${{ steps.changelog.outputs.release-notes }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Same RELEASE_PAT used for every other automation push to main - see CLAUDE.md.
          token: ${{ secrets.RELEASE_PAT }}

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true

      - name: 🏷️ Bump project version
        id: version
        run: |
          set -euo pipefail

          echo "inputs.bump=${{ inputs.bump }}"

          uv version --bump ${{ inputs.bump }}

          VERSION=$(uv version --short)
          TAG="v${VERSION}"
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"

          # A previous run may have already pushed this tag and failed later.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::${TAG} already exists on origin - a previous prepare-release run for this version may have failed partway through. Investigate/delete that tag before re-running, or this will silently skip a version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 📝 Bump changelog
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: bump
          version: ${{ inputs.bump }}
          keep-unreleased-section: true
          fail-on-empty-release-notes: true

      - name: 🔧 Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit & push to main
        id: commit
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"
          echo "TAG=$TAG"

          git add CHANGELOG.md pyproject.toml uv.lock
          # [skip ci]: this commit gets a real release below, not a dev build.
          git commit -m "Release ${TAG} [skip ci]"
          git push origin HEAD:main

          SHA=$(git rev-parse HEAD)
          echo "SHA=$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: 📝 Job summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"

          {
            echo "## 🏷️ Release ${TAG} Prepared"
            echo
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| 📌 Version bumped (\`pyproject.toml\`, \`uv.lock\`) | ✅ \`${VERSION}\` |"
            echo "| 📝 Changelog converted (\`CHANGELOG.md\`) | ✅ \`[Unreleased]\` → \`[${VERSION}]\` |"
            echo "| 💾 Committed & pushed to \`main\` | ✅ |"
            echo
            echo "Running CI, then building the wheel/sdist and Docker image, then publishing the release, then promoting the Docker image to :latest/:${VERSION} once everything above succeeds."
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: prepare-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ needs.prepare-release.outputs.sha }}

  build:
    name: Build
    needs: [prepare-release, ci]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.prepare-release.outputs.sha }}
      # Staging tag only - promote-image below moves this to :latest/:{version}.
      docker_tags: ghcr.io/afonsoc12/cookistash:build-${{ needs.prepare-release.outputs.sha }}

  create-release:
    name: Create GitHub Release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download dist artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: 🚀 Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ needs.prepare-release.outputs.sha }}
          body: ${{ needs.prepare-release.outputs.release_notes }}
          files: dist/*

      - name: 🔎 Verify release exists with expected assets
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare-release.outputs.tag }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Assets attached to $TAG:"
          echo "$ASSETS"

          echo "$ASSETS" | grep -q '\.whl$' || { echo "::error::No .whl attached to $TAG"; exit 1; }
          echo "$ASSETS" | grep -q '\.tar\.gz$' || { echo "::error::No sdist (.tar.gz) attached to $TAG"; exit 1; }

      - name: 📝 Job summary
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          {
            echo "## 🚀 Release ${TAG} Published"
            echo
            echo "Wheel/sdist confirmed attached. Promoting the Docker image to :latest/:\`{version}\` next."
            echo
            echo "| Link | |"
            echo "|---|---|"
            echo "| 📦 GitHub Release | **[${TAG}](${REPO_URL}/releases/tag/${TAG})** |"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-image:
    name: Promote Docker Image
    needs: [prepare-release, build, create-release]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: 🔨 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Promote staging image to :latest/:{version}
        run: |
          set -euo pipefail

          VERSION="${{ needs.prepare-release.outputs.version }}"
          STAGING="ghcr.io/afonsoc12/cookistash:build-${{ needs.prepare-release.outputs.sha }}"

          # Copies the existing manifest to new tags - no rebuild.
          docker buildx imagetools create \
            --tag "ghcr.io/afonsoc12/cookistash:${VERSION}" \
            --tag ghcr.io/afonsoc12/cookistash:latest \
            "$STAGING"

      - name: 📝 Job summary
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          {
            echo "## 🐳 Docker Image Promoted"
            echo
            echo "| Link | |"
            echo "|---|---|"
            echo "| 🐳 Docker image | [\`ghcr.io/afonsoc12/cookistash:${VERSION}\`](${REPO_URL}/pkgs/container/cookistash) |"
          } >> "$GITHUB_STEP_SUMMARY"
