name: 🏷️ Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  prepare-release:
    name: 🏷️ Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          activate-environment: true

      - name: 🏷️ Bump project version
        id: version
        run: |
          set -euo pipefail

          echo "inputs.bump=${{ inputs.bump }}"

          uv version --bump ${{ inputs.bump }}

          VERSION=$(uv version --short)
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 📝 Bump changelog
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: bump
          version: ${{ inputs.bump }}
          keep-unreleased-section: true
          fail-on-empty-release-notes: true

      - name: 🔧 Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit, tag & push
        run: |
          set -euo pipefail

          TAG="v${{ steps.version.outputs.version }}"
          echo "TAG=$TAG"

          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "Release ${TAG}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: 📝 Job summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          BADGE="https://img.shields.io/badge/prepared-${TAG}-blue?style=for-the-badge&logo=git&logoColor=white"
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"
          echo "REPO_URL=$REPO_URL"

          {
            echo "## 🏷️ Release ${TAG} Prepared"
            echo
            echo "![release](${BADGE})"
            echo
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| 📌 Version bumped (\`pyproject.toml\`, \`uv.lock\`) | ✅ \`${VERSION}\` |"
            echo "| 📝 Changelog converted (\`CHANGELOG.md\`) | ✅ \`[Unreleased]\` → \`[${VERSION}]\` |"
            echo "| 💾 Committed & pushed to \`main\` | ✅ |"
            echo "| 🏷️ Tag pushed | ✅ \`${TAG}\` |"
            echo
            echo "### 🚀 What happens next"
            echo
            echo "Pushing \`${TAG}\` triggers [release.yml](${REPO_URL}/actions/workflows/release.yml) to build the wheel/sdist, cut the GitHub Release, and push the multi-arch Docker image. Give it a minute, then check:"
            echo
            echo "| Link | |"
            echo "|---|---|"
            echo "| 📦 GitHub Release | **[${TAG}](${REPO_URL}/releases/tag/${TAG})** |"
            echo "| ⚙️ Release workflow run | [Actions tab](${REPO_URL}/actions/workflows/release.yml) |"
            echo "| 🐳 Docker image | [\`ghcr.io/afonsoc12/cookistash:${VERSION}\`](${REPO_URL}/pkgs/container/cookistash) |"
            echo
            echo "<details>"
            echo "<summary>📖 Release notes for ${TAG}</summary>"
            echo
            echo "${{ steps.changelog.outputs.release-notes }}"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
