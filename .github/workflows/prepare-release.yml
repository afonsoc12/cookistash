name: 🏷️ Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored if "version" is set)
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version override, e.g. 1.2.3 (optional - takes precedence over bump)"
        required: false
        type: string

jobs:
  prepare-release:
    name: 🏷️ Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          activate-environment: true

      - name: 🏷️ Bump project version
        id: version
        run: |
          set -euo pipefail

          OLD_VERSION=$(uv version --short)
          echo "inputs.version=${{ inputs.version }}"
          echo "inputs.bump=${{ inputs.bump }}"
          echo "OLD_VERSION=$OLD_VERSION"

          if [ -n "${{ inputs.version }}" ]; then
            if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version override must look like X.Y.Z, got '${{ inputs.version }}'"
              exit 1
            fi
            uv version "${{ inputs.version }}"

            # keep-a-changelog-action's bump command only accepts a bump
            # keyword (major/minor/patch/...), not an explicit version, so
            # an override needs the equivalent keyword derived by diffing
            # old vs new - whichever component changed at the highest
            # priority (major > minor > patch).
            IFS=. read -r OLD_MAJOR OLD_MINOR OLD_PATCH <<< "$OLD_VERSION"
            IFS=. read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "${{ inputs.version }}"
            if [ "$NEW_MAJOR" != "$OLD_MAJOR" ]; then
              BUMP_TYPE=major
            elif [ "$NEW_MINOR" != "$OLD_MINOR" ]; then
              BUMP_TYPE=minor
            elif [ "$NEW_PATCH" != "$OLD_PATCH" ]; then
              BUMP_TYPE=patch
            else
              echo "::error::version override '${{ inputs.version }}' is not greater than current '$OLD_VERSION'"
              exit 1
            fi
          else
            uv version --bump ${{ inputs.bump }}
            BUMP_TYPE="${{ inputs.bump }}"
          fi

          VERSION=$(uv version --short)
          echo "VERSION=$VERSION"
          echo "BUMP_TYPE=$BUMP_TYPE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

      - name: 📝 Bump changelog
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: bump
          version: ${{ steps.version.outputs.bump_type }}
          keep-unreleased-section: true
          fail-on-empty-release-notes: true

      - name: ✅ Verify changelog version matches pyproject.toml
        run: |
          set -euo pipefail

          echo "changelog version=${{ steps.changelog.outputs.version }}"
          echo "pyproject version=${{ steps.version.outputs.version }}"

          if [ "${{ steps.changelog.outputs.version }}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::CHANGELOG.md was bumped to '${{ steps.changelog.outputs.version }}' but pyproject.toml is '${{ steps.version.outputs.version }}' - they've drifted apart, most likely CHANGELOG.md's release history doesn't match pyproject.toml's actual version. Fix manually before re-running."
            exit 1
          fi

      - name: 🔧 Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit, tag & push
        run: |
          set -euo pipefail

          TAG="v${{ steps.version.outputs.version }}"
          echo "TAG=$TAG"

          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "Release ${TAG}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: 📝 Job summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          BADGE="https://img.shields.io/badge/prepared-${TAG}-blue?style=for-the-badge&logo=git&logoColor=white"
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"
          echo "REPO_URL=$REPO_URL"

          {
            echo "## 🏷️ Release ${TAG} Prepared"
            echo
            echo "![release](${BADGE})"
            echo
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| 📌 Version bumped (\`pyproject.toml\`, \`uv.lock\`) | ✅ \`${VERSION}\` |"
            echo "| 📝 Changelog converted (\`CHANGELOG.md\`) | ✅ \`[Unreleased]\` → \`[${VERSION}]\` |"
            echo "| 💾 Committed & pushed to \`main\` | ✅ |"
            echo "| 🏷️ Tag pushed | ✅ \`${TAG}\` |"
            echo
            echo "### 🚀 What happens next"
            echo
            echo "Pushing \`${TAG}\` triggers [release.yml](${REPO_URL}/actions/workflows/release.yml) to build the wheel/sdist, cut the GitHub Release, and push the multi-arch Docker image. Give it a minute, then check:"
            echo
            echo "| Link | |"
            echo "|---|---|"
            echo "| 📦 GitHub Release | **[${TAG}](${REPO_URL}/releases/tag/${TAG})** |"
            echo "| ⚙️ Release workflow run | [Actions tab](${REPO_URL}/actions/workflows/release.yml) |"
            echo "| 🐳 Docker image | [\`ghcr.io/afonsoc12/cookistash:${VERSION}\`](${REPO_URL}/pkgs/container/cookistash) |"
            echo
            echo "<details>"
            echo "<summary>📖 Release notes for ${TAG}</summary>"
            echo
            echo "${{ steps.changelog.outputs.release-notes }}"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
