name: 🏷️ Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  prepare-release:
    name: 🏷️ Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A push authenticated with the default GITHUB_TOKEN can't trigger other workflow runs,
          # so release.yml would never fire from this job's push to main. RELEASE_PAT is a
          # fine-grained PAT (see CONTRIBUTING/CLAUDE.md for required scopes) used instead.
          token: ${{ secrets.RELEASE_PAT }}

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true

      - name: 🏷️ Bump project version
        id: version
        run: |
          set -euo pipefail

          echo "inputs.bump=${{ inputs.bump }}"

          uv version --bump ${{ inputs.bump }}

          VERSION=$(uv version --short)
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 📝 Bump changelog
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: bump
          version: ${{ inputs.bump }}
          keep-unreleased-section: true
          fail-on-empty-release-notes: true

      - name: 🔧 Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit & push to main
        run: |
          set -euo pipefail

          TAG="v${{ steps.version.outputs.version }}"
          echo "TAG=$TAG"

          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "Release ${TAG}"
          git push origin HEAD:main

      - name: 🏷️ Create GitHub release
        env:
          # The default GITHUB_TOKEN can't trigger other workflow runs (same
          # reason the checkout above uses RELEASE_PAT) - release.yml listens
          # for this release being published, so it needs RELEASE_PAT here too.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          TAG="v${{ steps.version.outputs.version }}"
          echo "TAG=$TAG"

          # --target main creates the tag on the commit just pushed, as part
          # of publishing the release - no separate `git tag` step. One API
          # call, one release: published event, instead of a second push
          # event racing the one from the commit above.
          # Notes go through a file (--notes-file) rather than inline
          # --notes, so quotes/backticks in the changelog text can't break
          # the shell command.
          cat > /tmp/release-notes.md << 'RELEASE_NOTES_EOF'
          ${{ steps.changelog.outputs.release-notes }}
          RELEASE_NOTES_EOF

          gh release create "$TAG" \
            --target main \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md

      - name: 📝 Job summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          BADGE="https://img.shields.io/badge/prepared-${TAG}-blue?style=for-the-badge&logo=git&logoColor=white"
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"
          echo "REPO_URL=$REPO_URL"

          {
            echo "## 🏷️ Release ${TAG} Prepared"
            echo
            echo "![release](${BADGE})"
            echo
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| 📌 Version bumped (\`pyproject.toml\`, \`uv.lock\`) | ✅ \`${VERSION}\` |"
            echo "| 📝 Changelog converted (\`CHANGELOG.md\`) | ✅ \`[Unreleased]\` → \`[${VERSION}]\` |"
            echo "| 💾 Committed & pushed to \`main\` | ✅ |"
            echo "| 🏷️ GitHub Release published (tag \`${TAG}\` created as part of it) | ✅ |"
            echo
            echo "### 🚀 What happens next"
            echo
            echo "Publishing \`${TAG}\` triggers [release.yml](${REPO_URL}/actions/workflows/release.yml) to build the wheel/sdist and push the multi-arch Docker image, attaching them to the release above. Give it a minute, then check:"
            echo
            echo "| Link | |"
            echo "|---|---|"
            echo "| 📦 GitHub Release | **[${TAG}](${REPO_URL}/releases/tag/${TAG})** |"
            echo "| ⚙️ Release workflow run | [Actions tab](${REPO_URL}/actions/workflows/release.yml) |"
            echo "| 🐳 Docker image | [\`ghcr.io/afonsoc12/cookistash:${VERSION}\`](${REPO_URL}/pkgs/container/cookistash) |"
            echo
            echo "<details>"
            echo "<summary>📖 Release notes for ${TAG}</summary>"
            echo
            echo "${{ steps.changelog.outputs.release-notes }}"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
