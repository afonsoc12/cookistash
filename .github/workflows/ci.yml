name: 🔍 CI

concurrency: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    name: 🔍 Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_NAME: cookistash
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          activate-environment: true

      - name: 📦 Install dependencies
        run: uv sync --locked --all-groups

      - name: 🗄️ Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE cookistash;"

      - name: 🔎 ruff format
        run: uv run ruff format --check

      - name: 🔎 ruff check
        run: uv run ruff check

      - name: 🔬 mypy
        run: uv run mypy cookistash/

      - name: ✅ Run unit tests (with coverage)
        run: uv run pytest -m "not e2e"

      - name: 📊 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14

  build:
    name: 🐳 Build container
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐳 Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cookistash:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📏 Report image size
        run: |
          SIZE=$(docker image inspect cookistash:ci --format='{{.Size}}')
          echo "Image size: $SIZE bytes ($((SIZE / 1048576)) MB)"
