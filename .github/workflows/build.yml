name: Build

# Shared by dev-release.yml and release.yml. Builds `ref` as-is - no
# `uv version` mutation, except version_suffix for dev builds.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      docker_tags:
        required: true
        type: string
      version_suffix:
        required: false
        type: string
        default: ""

jobs:
  python:
    name: Python Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: 🏷️ Apply local version suffix
        if: inputs.version_suffix != ''
        run: uv version "$(uv version --short)${{ inputs.version_suffix }}"

      - name: 🏗️ Build wheel + sdist
        run: uv build

      - name: 📤 Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: 📝 Job summary
        run: |
          {
            echo "## 🐍 Python Build Summary"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🔨 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ inputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Job summary
        run: |
          {
            echo "## 🐳 Docker Build Summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ✅ Success |"
            echo "| Commit | \`${{ inputs.ref }}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo
            echo "### Tags"
            echo
            IFS=',' read -ra TAGS <<< "${{ inputs.docker_tags }}"
            for t in "${TAGS[@]}"; do
              echo "- \`$t\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
