name: Build

# Shared by dev-release.yml and release.yml. Builds `ref` as-is - no
# `uv version` mutation, except version_suffix for dev builds.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      docker_tags:
        required: true
        type: string
      version_suffix:
        required: false
        type: string
        default: ""

jobs:
  wheels:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: 🏷️ Apply local version suffix
        if: inputs.version_suffix != ''
        run: uv version "$(uv version --short)${{ inputs.version_suffix }}"

      - name: 🏗️ Build wheel + sdist
        run: uv build

      - name: 📤 Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🔨 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ inputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🐳 Docker Build Summary

          ## Build Information
          - **Status**: ✅ Success
          - **Commit SHA**: ${{ inputs.ref }}

          ## Tags
          ${{ inputs.docker_tags }}
          EOF
