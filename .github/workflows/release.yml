name: 🚀 Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  ci:
    name: 🔍 CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write

  meta:
    name: 🏷️ Determine release metadata
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      gh_tag: ${{ steps.meta.outputs.gh_tag }}
      docker_tags: ${{ steps.meta.outputs.docker_tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: 🏷️ Determine metadata
        id: meta
        run: |
          set -euo pipefail

          VERSION=$(uv version --short)
          SHORT_SHA=$(git rev-parse --short HEAD)

          # A tag only counts as a real release if it's actually reachable
          # from main - a tag pushed from any other branch/commit falls
          # back to a dev pre-release instead of cutting a full release.
          IS_RELEASE=false
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            git fetch origin main --quiet
            if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
              IS_RELEASE=true
            else
              echo "::warning::${{ github.ref_name }} is not on main - treating as a pre-release, not a full release."
            fi
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT

          if [ "$IS_RELEASE" = "true" ]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "gh_tag=v${VERSION}" >> $GITHUB_OUTPUT
            echo "docker_tags=ghcr.io/afonsoc12/cookistash:${VERSION},ghcr.io/afonsoc12/cookistash:latest" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
            # {version}-dev+{sha}: valid SemVer (pre-release identifier
            # "dev", build metadata the commit SHA). Docker/OCI tags don't
            # allow "+" at all (only [a-zA-Z0-9_][a-zA-Z0-9._-]*), so the
            # Docker tag swaps it for "-" instead.
            echo "gh_tag=${VERSION}-dev+${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "docker_tags=ghcr.io/afonsoc12/cookistash:dev,ghcr.io/afonsoc12/cookistash:${VERSION}-dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

  github-release:
    name: 📦 GitHub Release
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: 🏗️ Build wheel + sdist
        run: uv build

      - name: 📖 Extract changelog notes
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: ${{ needs.meta.outputs.is_release == 'true' && 'latest' || 'unreleased' }}

      - name: 🚀 Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.gh_tag }}
          name: ${{ needs.meta.outputs.gh_tag }}
          body: ${{ steps.changelog.outputs.release-notes }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          files: dist/*

  build:
    name: 🐳 Build & Push Docker Image
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🔨 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.meta.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🐳 Docker Build Summary

          ## Build Information
          - **Status**: ✅ Success
          - **Branch/Tag**: ${{ github.ref_name }}
          - **Commit SHA**: ${{ github.sha }}

          ## Tags
          ${{ needs.meta.outputs.docker_tags }}
          EOF
