name: 🚀 Release

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  ci:
    name: 🔍 CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write

  meta:
    name: 🏷️ Determine release metadata
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      gh_tag: ${{ steps.meta.outputs.gh_tag }}
      docker_tags: ${{ steps.meta.outputs.docker_tags }}
      version: ${{ steps.meta.outputs.version }}
      build_version: ${{ steps.meta.outputs.build_version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: 🏷️ Determine metadata
        id: meta
        run: |
          set -euo pipefail

          VERSION=$(uv version --short)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION"
          echo "SHORT_SHA=$SHORT_SHA"
          echo "github.event_name=${{ github.event_name }}"
          echo "github.ref=${{ github.ref }}"

          # A published release (created by prepare-release.yml, tag included as
          # part of publishing it) is a real release. Anything else - a plain
          # push to main, or someone manually publishing a release off a commit
          # that never made it to main - falls back to a pre-release.
          IS_RELEASE=false
          if [[ "${{ github.event_name }}" == release ]]; then
            git fetch origin main --quiet
            if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
              IS_RELEASE=true
            else
              echo "::warning::${{ github.ref_name }} is not on main - treating as a pre-release, not a full release."
            fi
          fi
          echo "IS_RELEASE=$IS_RELEASE"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT

          if [ "$IS_RELEASE" = "true" ]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "gh_tag=v${VERSION}" >> $GITHUB_OUTPUT
            echo "build_version=${VERSION}" >> $GITHUB_OUTPUT
            echo "docker_tags=ghcr.io/afonsoc12/cookistash:${VERSION},ghcr.io/afonsoc12/cookistash:latest" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
            # Docker tags can't contain "+", so use "-" there instead of the SemVer build-metadata separator.
            echo "gh_tag=v${VERSION}-dev+${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "build_version=${VERSION}-dev+${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "docker_tags=ghcr.io/afonsoc12/cookistash:dev,ghcr.io/afonsoc12/cookistash:${VERSION}-dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

          echo "::group::Computed outputs"
          echo "prerelease=$(grep '^prerelease=' $GITHUB_OUTPUT | tail -1 | cut -d= -f2-)"
          echo "gh_tag=$(grep '^gh_tag=' $GITHUB_OUTPUT | tail -1 | cut -d= -f2-)"
          echo "build_version=$(grep '^build_version=' $GITHUB_OUTPUT | tail -1 | cut -d= -f2-)"
          echo "docker_tags=$(grep '^docker_tags=' $GITHUB_OUTPUT | tail -1 | cut -d= -f2-)"
          echo "::endgroup::"

  github-release:
    name: 📦 GitHub Release
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: 🏷️ Set package version for this build
        run: |
          echo "build_version (input)=${{ needs.meta.outputs.build_version }}"
          uv version "${{ needs.meta.outputs.build_version }}"
          echo "uv version --short (applied)=$(uv version --short)"

      - name: 🏗️ Build wheel + sdist
        run: uv build

      # A real release's GitHub Release already exists by this point -
      # prepare-release.yml's `gh release create` is what triggered this run
      # in the first place. Just attach the build artifacts to it.
      - name: 📤 Upload artifacts to the release
        if: needs.meta.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.meta.outputs.gh_tag }}" dist/*.whl dist/*.tar.gz --clobber

      # The dev/pre-release path has no release object yet - a plain push to
      # main doesn't go through prepare-release.yml, so this job creates one.
      - name: 📖 Extract changelog notes
        id: changelog
        if: needs.meta.outputs.is_release != 'true'
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: unreleased

      - name: 🔎 Verify changelog notes aren't empty
        if: needs.meta.outputs.is_release != 'true'
        run: |
          if [ -z "${{ steps.changelog.outputs.release-notes }}" ]; then
            echo "::error::CHANGELOG.md's [Unreleased] section is empty - add an entry before releasing."
            exit 1
          fi

      - name: 🚀 Create pre-release
        if: needs.meta.outputs.is_release != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.gh_tag }}
          name: ${{ needs.meta.outputs.gh_tag }}
          body: ${{ steps.changelog.outputs.release-notes }}
          prerelease: true
          files: |
            dist/*.whl
            dist/*.tar.gz

  build:
    name: 🐳 Build & Push Docker Image
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: 🏷️ Set package version for this build
        run: uv version "${{ needs.meta.outputs.build_version }}"

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🔨 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.meta.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🐳 Docker Build Summary

          ## Build Information
          - **Status**: ✅ Success
          - **Branch/Tag**: ${{ github.ref_name }}
          - **Commit SHA**: ${{ github.sha }}

          ## Tags
          ${{ needs.meta.outputs.docker_tags }}
          EOF
