name: Release

concurrency:
  group: prepare-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write

  prepare-release:
    name: Prepare Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      release_notes: ${{ steps.changelog.outputs.release-notes }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true

      - name: 🏷️ Bump project version
        id: version
        run: |
          set -euo pipefail

          echo "inputs.bump=${{ inputs.bump }}"

          uv version --bump ${{ inputs.bump }}

          VERSION=$(uv version --short)
          TAG="v${VERSION}"
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"

          # A previous run may have already pushed this tag and failed later.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::${TAG} already exists on origin - a previous prepare-release run for this version may have failed partway through. Investigate/delete that tag before re-running, or this will silently skip a version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 📝 Bump changelog
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: bump
          version: ${{ inputs.bump }}
          keep-unreleased-section: true
          fail-on-empty-release-notes: true

      - name: 🔧 Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit & push to main
        id: commit
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"
          echo "TAG=$TAG"

          git add CHANGELOG.md pyproject.toml uv.lock
          # [skip ci]: this commit gets a real release below, not a dev build.
          git commit -m "Release ${TAG} [skip ci]"
          git push origin HEAD:main

          SHA=$(git rev-parse HEAD)
          echo "SHA=$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: 📝 Job summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"

          {
            echo "## 🏷️ Release ${TAG} Prepared"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ✅ Success |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Changelog | \`[Unreleased]\` → \`[${VERSION}]\` |"
            echo "| Committed to \`main\` | ✅ |"
            echo
            echo "CI already passed. Building the wheel/sdist and Docker image next, then publishing the release once everything above succeeds."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: prepare-release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.prepare-release.outputs.sha }}
      docker_tags: ghcr.io/afonsoc12/cookistash:${{ needs.prepare-release.outputs.version }},ghcr.io/afonsoc12/cookistash:latest

  create-release:
    name: Create GitHub Release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: 🚀 Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ needs.prepare-release.outputs.sha }}
          body: ${{ needs.prepare-release.outputs.release_notes }}
          files: dist/*

      - name: 🔎 Verify release exists with expected assets
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare-release.outputs.tag }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Assets attached to $TAG:"
          echo "$ASSETS"

          echo "$ASSETS" | grep -q '\.whl$' || { echo "::error::No .whl attached to $TAG"; exit 1; }
          echo "$ASSETS" | grep -q '\.tar\.gz$' || { echo "::error::No sdist (.tar.gz) attached to $TAG"; exit 1; }

      - name: 📝 Job summary
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          VERSION="${{ needs.prepare-release.outputs.version }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          {
            echo "## 🚀 Release ${TAG} Published"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ✅ Success |"
            echo "| GitHub Release | [${TAG}](${REPO_URL}/releases/tag/${TAG}) |"
            echo "| Wheel/sdist | ✅ Verified attached |"
            echo "| Docker image | [\`ghcr.io/afonsoc12/cookistash:${VERSION}\`](${REPO_URL}/pkgs/container/cookistash) |"
          } >> "$GITHUB_STEP_SUMMARY"
