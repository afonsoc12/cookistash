[project]
name = "cookistash"
version = "0.0.1"
description = "Scrapes Cookidoo (Bimby/Thermomix) recipes; optionally syncs them to Mealie when configured"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "celery>=5.5.3",
    "certifi==2025.1.31",
    "charset-normalizer==3.4.1",
    "django>=5.2.7",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-json-widget>=2.0.4",
    "django-unfold>=0.38.0",
    "flower>=2.0.1",
    "gunicorn>=23.0.0",
    "idna==3.10",
    "packaging==24.2",
    "psycopg2-binary>=2.9.11",
    "python-slugify==8.0.4",
    "redis>=6.4.0",
    "requests==2.32.3",
    "supervisor>=4.2.5",
    "text-unidecode==1.3",
    "urllib3==2.3.0",
]

[dependency-groups]
dev = [
    "coverage>=7.11.0",
    "django-stubs>=5.2.0",
    "mypy>=1.14.0",
    "pytest==8.3.4",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.11.1",
    "ruff==0.15.2",
    "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cookistash.settings"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --cov=cookistash --cov-report=term-missing --cov-report=html --cov-report=xml"
markers = [
    "e2e: end-to-end tests against live docker-compose services (Postgres, Mealie) - excluded by default, run explicitly with -m e2e",
]

[tool.coverage.run]
source = ["cookistash"]
omit = ["*/migrations/*", "*/tests/*", "cookistash/wsgi.py"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C90",    # mccabe
]

[tool.ruff.lint.per-file-ignores]
# Generic reflection-based (de)serializer walking every model field - complexity
# is inherent to what it does, splitting it up would hurt readability more than help.
"cookistash/mealie/models.py" = ["C901"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
# The codebase has no type annotations yet - this catches real errors (bad
# attribute access, wrong return types) in code that *is* annotated without
# demanding annotations be added everywhere first. Tighten incrementally
# (disallow_untyped_defs etc.) as coverage grows.
check_untyped_defs = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "cookistash.settings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
