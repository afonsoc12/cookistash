server {
    listen 8000;

    # gunicorn doesn't serve static files itself (unlike `manage.py
    # runserver`) - nginx serves the collectstatic output directly instead
    # of round-tripping every asset through Django.
    location /static/ {
        alias /app/staticfiles/;
    }

    location /flower/ {
        proxy_pass http://127.0.0.1:5555/flower/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
