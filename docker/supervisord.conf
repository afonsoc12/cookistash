[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:django]
command=/app/.venv/bin/gunicorn cookistash.wsgi:application --bind 0.0.0.0:8000 --workers 1
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; -B runs the beat scheduler inside the worker process instead of as its own
; process - one less full Python/Django import for a single-node deployment
; that doesn't need beat to survive worker restarts independently.
; --pool=solo runs tasks in this single process instead of prefork-ing one
; child per host CPU core - each forked child carries its own full copy of
; Django's import graph, which is wasted at this task volume (scrape/rescrape
; jobs, not high-throughput).
[program:celery-worker]
command=/app/.venv/bin/celery -A cookistash worker -B --pool=solo -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
